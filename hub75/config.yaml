name: HUB75 Album Artwork
version: "0.4.0"
slug: hub75_album_art
description: Display Music Assistant album artwork on a WLED HUB75 matrix
url: https://github.com/JannicSJensen/ha-hub75-app
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
homeassistant_api: true
options:
  display_url: http://192.168.2.214
  player_entities: []
  idle_action: keep
  pause_then_off: true
  show_track_info: true
  page_interval: 8
  refresh_interval: 5
  log_level: info
schema:
  display_url: url
  player_entities:
    - match(^media_player\.[a-z0-9_]+$)
  idle_action: list(keep|off)
  pause_then_off: bool
  show_track_info: bool
  page_interval: int(3,60)
  refresh_interval: int(1,60)
  log_level: list(debug|info|warning|error)