name: HUB75 Album Artwork
version: "0.8.1"
slug: hub75_album_art
description: Display Music Assistant album artwork on a WLED HUB75 matrix
url: https://github.com/JannicSJensen/ha-hub75-app
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
homeassistant_api: true
host_network: true
options:
  display_url: http://192.168.2.214
  output_protocol: http
  player_entities: []
  idle_action: keep
  pause_then_off: true
  show_track_info: true
  show_artist_images: false
  artist_image_count: 3
  music_assistant_url: ""
  music_assistant_token: ""
  show_equalizer: false
  audio_sync_port: 11988
  audio_sync_interface: 0.0.0.0
  page_interval: 8
  rotation: "0"
  refresh_interval: 5
  log_level: info
schema:
  display_url: url
  output_protocol: list(http|ddp)
  player_entities:
    - match(^media_player\.[a-z0-9_]+$)
  idle_action: list(keep|off)
  pause_then_off: bool
  show_track_info: bool
  show_artist_images: bool
  artist_image_count: int(1,3)
  music_assistant_url: str
  music_assistant_token: password?
  show_equalizer: bool
  audio_sync_port: port
  audio_sync_interface: str
  page_interval: int(3,60)
  rotation: list(0|45|90|135|180)
  refresh_interval: int(1,60)
  log_level: list(debug|info|warning|error)